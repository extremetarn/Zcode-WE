name: Verify
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:native
      - run: npm run test:native
